<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tiệm Bánh Mì Sài Gòn</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #FFD400;
    color: #333;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 70px 12px 80px;
    position: relative;
    overflow-x: hidden;
  }
  
  #pets-layer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  
  .pet {
    position: absolute;
    animation: pet-wiggle 2.5s ease-in-out infinite;
    transform-origin: center bottom;
    pointer-events: auto;
    cursor: pointer;
    filter: 
      drop-shadow(2px 0 0 #fff)
      drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff)
      drop-shadow(0 -2px 0 #fff)
      drop-shadow(0 6px 10px rgba(0,0,0,0.25));
  }
  
  .pet img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  
  .pet { width: 200px; height: 200px; }
  
  @keyframes pet-wiggle {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  
  @media (max-width: 400px) {
    .pet { 
      width: 45px; 
      height: 45px;
      filter: 
        drop-shadow(1.5px 0 0 #fff)
        drop-shadow(-1.5px 0 0 #fff)
        drop-shadow(0 1.5px 0 #fff)
        drop-shadow(0 -1.5px 0 #fff)
        drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    }
  }
  
  @media (min-width: 401px) and (max-width: 600px) {
    .pet { width: 90px; height: 90px; }
  }
  
  @media (min-width: 601px) and (max-width: 1024px) {
    .pet { width: 140px; height: 140px; }
  }
  
  .calendar-card {
    background: #FFFDF5;
    background-image: 
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.008) 2px,
        rgba(0,0,0,0.008) 4px
      );
    border-radius: 2px;
    max-width: 420px;
    width: 100%;
    padding: 24px 20px 20px;
    position: relative;
    z-index: 10;
    box-shadow: 
      0 1px 2px rgba(0,0,0,0.1),
      0 4px 8px rgba(0,0,0,0.1),
      0 12px 24px rgba(0,0,0,0.15),
      0 24px 48px rgba(0,0,0,0.1);
    transform: rotate(-0.5deg);
  }
  
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    position: relative;
    min-height: 60px;
    padding: 0 4px;
  }
  
  .nav-btn {
    background: transparent;
    border: none;
    font-size: 36px;
    color: #333;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    font-weight: 300;
    transition: transform 0.15s, color 0.15s;
    user-select: none;
    -webkit-user-select: none;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    z-index: 10;
    position: relative;
  }
  
  .nav-btn:hover { color: #E60000; }
  .nav-btn:active { transform: scale(0.85); background: rgba(0,0,0,0.05); }
  
  .cal-year-badge {
    background: #E60000;
    background-image: 
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.08) 3px,
        rgba(255,255,255,0.08) 6px
      );
    color: #fff;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 
      0 4px 12px rgba(230,0,0,0.35),
      inset 0 0 20px rgba(0,0,0,0.15);
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    pointer-events: none;
  }
  
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #eee;
  }
  
  .weekdays div {
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: #666;
    padding: 4px 0;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    line-height: 1.2;
  }
  
  .weekdays .sun { color: #E6A000; }
  .weekdays .sat { color: #E6A000; }
  
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  
  .day {
    aspect-ratio: 1;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    border-radius: 50%;
    transition: transform 0.15s;
    font-size: 15px;
    font-weight: 400;
    color: #333;
    padding: 4px;
  }
  
  .day .num { 
    font-size: 15px; 
    font-weight: 500; 
    line-height: 1;
    position: relative;
    z-index: 3;
  }
  
  .day .dot {
    width: 5px; 
    height: 5px; 
    border-radius: 50%;
    margin-top: 3px; 
    background: transparent;
    position: relative;
    z-index: 3;
  }
  
  .day.sun .num { color: #E6A000; }
  .day.sat .num { color: #E6A000; }
  
  .day.empty { cursor: default; pointer-events: none; }
  .day:not(.empty):active { transform: scale(0.9); }
  
  .day.green::before {
    content: '';
    position: absolute;
    top: 5%;
    left: 5%;
    right: 5%;
    bottom: 5%;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 40%, rgba(46,125,50,0.55) 0%, rgba(46,125,50,0.35) 60%, rgba(46,125,50,0.55) 100%);
    z-index: 1;
    mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    mask-composite: intersect;
    -webkit-mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    -webkit-mask-composite: source-in;
  }
  .day.green .dot { background: #2E7D32; }
  .day.green::after {
    content: '';
    position: absolute;
    top: 2%;
    left: 2%;
    right: 2%;
    bottom: 2%;
    border-radius: 50%;
    border: 2.5px solid #2E7D32;
    z-index: 2;
    filter: url(#crayon-wobble);
    opacity: 0.8;
  }
  
  .day.yellow::before {
    content: '';
    position: absolute;
    top: 5%;
    left: 5%;
    right: 5%;
    bottom: 5%;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 40%, rgba(249,168,37,0.6) 0%, rgba(249,168,37,0.4) 60%, rgba(249,168,37,0.6) 100%);
    z-index: 1;
    mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    mask-composite: intersect;
    -webkit-mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    -webkit-mask-composite: source-in;
  }
  .day.yellow .dot { background: #F9A825; }
  .day.yellow::after {
    content: '';
    position: absolute;
    top: 2%;
    left: 2%;
    right: 2%;
    bottom: 2%;
    border-radius: 50%;
    border: 2.5px solid #F9A825;
    z-index: 2;
    filter: url(#crayon-wobble);
    opacity: 0.8;
  }
  
  .day.red::before {
    content: '';
    position: absolute;
    top: 5%;
    left: 5%;
    right: 5%;
    bottom: 5%;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 40%, rgba(198,40,40,0.5) 0%, rgba(198,40,40,0.3) 60%, rgba(198,40,40,0.5) 100%);
    z-index: 1;
    mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    mask-composite: intersect;
    -webkit-mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    -webkit-mask-composite: source-in;
  }
  .day.red .dot { background: #C62828; }
  .day.red::after {
    content: '';
    position: absolute;
    top: 2%;
    left: 2%;
    right: 2%;
    bottom: 2%;
    border-radius: 50%;
    border: 2.5px solid #C62828;
    z-index: 2;
    filter: url(#crayon-wobble);
    opacity: 0.8;
  }
  
  /* Ngày có nhập hàng — xanh dương */
  .day.blue::before {
    content: '';
    position: absolute;
    top: 5%;
    left: 5%;
    right: 5%;
    bottom: 5%;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 40%, rgba(25,118,210,0.55) 0%, rgba(25,118,210,0.35) 60%, rgba(25,118,210,0.55) 100%);
    z-index: 1;
    mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    mask-composite: intersect;
    -webkit-mask-image: 
      repeating-linear-gradient(45deg, black, black 2px, transparent 2px, transparent 3px),
      repeating-linear-gradient(-45deg, black, black 3px, transparent 3px, transparent 4px);
    -webkit-mask-composite: source-in;
  }
  .day.blue .dot { background: #1976D2; }
  .day.blue::after {
    content: '';
    position: absolute;
    top: 2%;
    left: 2%;
    right: 2%;
    bottom: 2%;
    border-radius: 50%;
    border: 2.5px solid #1976D2;
    z-index: 2;
    filter: url(#crayon-wobble);
    opacity: 0.85;
  }
  
  .day.today { box-shadow: inset 0 0 0 2px #FF6F00; }
  
  .legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 16px 0 0;
    font-size: 11px;
    color: #666;
    flex-wrap: wrap;
    border-top: 1px solid #eee;
    margin-top: 12px;
  }
  
  .legend span { display: flex; align-items: center; gap: 5px; }
  
  .legend .swatch { 
    width: 12px; 
    height: 12px; 
    border-radius: 50%;
    position: relative;
  }
  .legend .swatch::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0.7;
  }
  
  .shop-name-wrapper {
    text-align: center;
    margin-top: 24px;
    position: relative;
    z-index: 10;
    display: inline-block;
    padding: 12px 28px;
    transform: rotate(-1.5deg);
    cursor: pointer;
    transition: transform 0.15s;
  }
  
  .shop-name-wrapper:active { transform: rotate(-1.5deg) scale(0.95); }
  
  .shop-name-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: -8px;
    right: -8px;
    bottom: 0;
    background: rgba(255, 235, 130, 0.75);
    background-image: 
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.3) 3px,
        rgba(255,255,255,0.3) 4px
      );
    box-shadow: 
      0 2px 6px rgba(0,0,0,0.12),
      inset 0 0 12px rgba(255,255,255,0.4);
    z-index: 1;
    clip-path: polygon(
      0% 8%, 2% 0%, 5% 6%, 8% 2%, 12% 7%, 88% 7%, 92% 2%, 95% 6%, 98% 0%, 100% 8%,
      100% 92%, 98% 100%, 95% 94%, 92% 98%, 88% 93%, 12% 93%, 8% 98%, 5% 94%, 2% 100%, 0% 92%
    );
  }
  
  .shop-name {
    text-align: center;
    color: #8B0000;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    position: relative;
    z-index: 2;
  }
  
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    overflow-y: auto;
    padding: 16px;
  }
  
  .modal-overlay.active { display: block; }
  
  .modal {
    background: #fff;
    border-radius: 16px;
    max-width: 480px;
    margin: 20px auto;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  
  .modal h2 {
    margin: 0 0 16px 0;
    font-size: 18px;
    color: #5D4037;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  
  .modal h2 .close {
    background: #eee;
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    color: #666;
    flex-shrink: 0;
  }
  
  .section-title {
    font-size: 14px;
    font-weight: bold;
    color: #FF6F00;
    margin: 16px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid #FFE0B2;
  }
  
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
  }
  
  .row label { flex: 1; font-size: 15px; color: #555; min-width: 0; }
  
  .row input {
    width: 110px;
    padding: 10px;
    border: 2px solid #FFE0B2;
    border-radius: 8px;
    font-size: 16px;
    text-align: right;
    font-weight: bold;
    background: #FFFDE7;
    font-family: inherit;
    min-width: 0;
    box-sizing: border-box;
  }
  
  .row input:focus { outline: none; border-color: #FFC107; background: #fff; }
  
  .row .unit {
    font-size: 13px;
    color: #999;
    width: 40px;
    text-align: left;
    flex-shrink: 0;
  }
  
  .row input:disabled,
  .item-row input:disabled,
  .note-input:disabled {
    background: #f5f5f5 !important;
    color: #666 !important;
    cursor: not-allowed;
    border-color: #ddd !important;
  }
  
  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 15px;
    border-bottom: 1px dashed #f0f0f0;
  }
  
  .result-row .label { color: #555; }
  .result-row .value { font-weight: bold; color: #333; }
  
  .btn-secondary {
    width: 100%;
    padding: 12px;
    background: #fff;
    border: 2px solid #FFC107;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    color: #5D4037;
    margin-top: 16px;
    cursor: pointer;
  }
  
  .btn-edit {
    width: 100%;
    padding: 14px;
    background: #FFC107;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    color: #5D4037;
    margin-top: 16px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,193,7,0.4);
  }
  
  .btn-edit:active { transform: scale(0.98); }
  
  .note-input {
    width: 100%;
    padding: 10px;
    border: 2px solid #FFE0B2;
    border-radius: 8px;
    font-size: 15px;
    background: #FFFDE7;
    font-family: inherit;
    box-sizing: border-box;
  }
  
  .item-row {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px 0;
    width: 100%;
    box-sizing: border-box;
  }
  
  .item-row input {
    padding: 8px;
    border: 2px solid #FFE0B2;
    border-radius: 8px;
    font-size: 14px;
    background: #FFFDE7;
    font-family: inherit;
    min-width: 0;
    box-sizing: border-box;
  }
  
  .item-row input.name { flex: 1 1 55%; text-align: left; width: 55%; }
  .item-row input.num { flex: 1 1 35%; text-align: right; width: 35%; }
  
  .item-row .remove {
    background: #FFCDD2;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    color: #C62828;
    cursor: pointer;
    font-size: 14px;
    flex: 0 0 32px;
  }
  
  .item-row .remove:disabled {
    background: #f0f0f0;
    color: #ccc;
    cursor: not-allowed;
  }
  
  .btn-add-item {
    background: #FFF3CD;
    border: 1px dashed #FFC107;
    color: #5D4037;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  
  .btn-add-item:disabled {
    background: #f5f5f5;
    border-color: #ddd;
    color: #999;
    cursor: not-allowed;
  }
  
  .sync-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s;
    white-space: nowrap;
  }
  
  .sync-ok { background: #C8E6C9; color: #2E7D32; }
  .sync-pending { background: #FFF3CD; color: #F57C00; animation: pulse 1s infinite; }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  
  .summary-btn {
    background: transparent;
    border: none;
    padding: 16px 44px;
    font-size: 15px;
    font-weight: 700;
    color: #8B0000;
    cursor: pointer;
    margin-top: 24px;
    z-index: 10;
    position: relative;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.15s;
    font-family: inherit;
  }
  
  .summary-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255,255,255,0.7);
    background-image: 
      repeating-linear-gradient(
        -12deg,
        rgba(255,255,255,0.9) 0px,
        rgba(255,255,255,0.9) 2px,
        rgba(255,255,255,0.3) 2px,
        rgba(255,255,255,0.3) 3px
      ),
      repeating-linear-gradient(
        8deg,
        rgba(255,255,255,0.7) 0px,
        rgba(255,255,255,0.7) 1px,
        transparent 1px,
        transparent 2px
      );
    z-index: -1;
    border-radius: 4px;
    box-shadow: 
      0 2px 6px rgba(0,0,0,0.1),
      inset 0 0 12px rgba(255,255,255,0.6);
    filter: url(#crayon-wobble);
  }
  
  .summary-btn::after {
    content: '';
    position: absolute;
    top: -3px;
    left: -3px;
    right: -3px;
    bottom: -3px;
    border: 2.5px solid #8B0000;
    border-radius: 6px;
    filter: url(#crayon-wobble);
    opacity: 0.85;
    pointer-events: none;
  }
  
  .summary-btn:active { 
    transform: scale(0.95); 
  }
  
  @media (max-width: 380px) {
    .calendar-card { padding: 20px 14px 16px; }
    .nav-btn { font-size: 30px; width: 40px; height: 40px; }
    .cal-year-badge { width: 88px; height: 88px; font-size: 19px; top: -44px; }
    .weekdays div { font-size: 8px; }
    .day .num { font-size: 14px; }
    body { padding: 70px 8px 80px; }
    
    .item-row input { font-size: 13px; padding: 7px 6px; }
    .item-row input.name { flex: 1 1 50%; width: 50%; }
    .item-row input.num { flex: 1 1 35%; width: 35%; }
    .item-row .remove { flex: 0 0 28px; width: 28px; height: 28px; }
    
    .row input { width: 90px; font-size: 15px; padding: 8px; }
    .row .unit { width: 36px; font-size: 12px; }
    
    .shop-name-wrapper { padding: 10px 22px; }
    .shop-name { font-size: 13px; }
    
    .summary-btn { padding: 14px 36px; font-size: 14px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="crayon-wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="pets-layer"></div>

<div class="calendar-card">
  <div class="cal-header">
    <button class="nav-btn prev" onclick="changeMonth(-1)" aria-label="Tháng trước">‹</button>
    <div class="cal-year-badge" id="yearBadge">9/2026</div>
    <button class="nav-btn next" onclick="changeMonth(1)" aria-label="Tháng sau">›</button>
  </div>

<script>
let data = {};

function buildData() {
  for (const key in RAW_DATA) {
    const r = RAW_DATA[key];
    const banhKhong = 0;
    const banh15 = r.tongBan - r.banh20 - banhKhong;
    const tienBan = banhKhong * 4000 + banh15 * 15000 + r.banh20 * 20000 + r.nuoc * 15000;
    const tongChiPhi = r.chiPhi.reduce((s, i) => s + (i.soTien || 0), 0);
    const tienCat = r.tienCat * 1000;
    const tienLeDau = r.tienLeDau * 1000;
    
    data[key] = {
      nhapMoi: r.nhapMoi,
      tonDau: r.tonDau,
      banhKhong: banhKhong,
      banh15: banh15,
      banh20: r.banh20,
      nuoc: r.nuoc,
      tienLeDau: tienLeDau,
      tienCat: tienCat,
      chiPhi: r.chiPhi,
      ghiChu: r.ghiChu || '',
      tongBanhBan: r.tongBan,
      tienBan: tienBan,
      tongChiPhi: tongChiPhi,
      tienTon: tienLeDau + tienBan - tongChiPhi - tienCat
    };
  }
}
buildData();

const TODAY = new Date();
let currentMonth = TODAY.getMonth();
let currentYear = TODAY.getFullYear();

function fmt(n) { return (n || 0).toLocaleString('vi-VN') + 'đ'; }
function dateKey(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function getTodayKey() { return dateKey(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()); }

function isDayEmpty(d) {
  if (!d) return true;
  if ((d.tongBanhBan || 0) > 0) return false;
  if ((d.nhapMoi || 0) > 0) return false;
  if ((d.tonDau || 0) > 0) return false;
  if ((d.nuoc || 0) > 0) return false;
  if ((d.tienLeDau || 0) > 0) return false;
  if ((d.tienCat || 0) > 0) return false;
  if (d.chiPhi && d.chiPhi.some(c => (c.soTien || 0) > 0 || (c.ten || '').trim() !== '')) return false;
  if (d.ghiChu && d.ghiChu.trim() !== '') return false;
  return true;
}

function renderCalendar() {
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  
  document.getElementById('yearBadge').textContent = `${currentMonth + 1}/${currentYear}`;
  
  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    cal.appendChild(empty);
  }
  
  for (let d = 1; d <= daysInMonth; d++) {
    const dayEl = document.createElement('div');
    dayEl.className = 'day';
    const dow = new Date(currentYear, currentMonth, d).getDay();
    if (dow === 0) dayEl.classList.add('sun');
    if (dow === 6) dayEl.classList.add('sat');
    
    const key = dateKey(currentYear, currentMonth, d);
    const dayData = data[key];
    
    if (dayData && !isDayEmpty(dayData)) {
      const sold = dayData.tongBanhBan;
      if (sold >= 28) dayEl.classList.add('green');
      else if (sold >= 20) dayEl.classList.add('yellow');
      else dayEl.classList.add('red');
    }
    
    if (key === getTodayKey()) dayEl.classList.add('today');
    
    dayEl.innerHTML = `<div class="num">${d}</div><div class="dot"></div>`;
    dayEl.onclick = () => openDayModal(key);
    cal.appendChild(dayEl);
  }
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}

let currentEditingKey = null;
let currentDayData = null;
let isEditMode = false;

function openDayModal(key) {
  currentEditingKey = key;
  const [y, m, d] = key.split('-');
  document.getElementById('modalDate').textContent = `Ngày ${parseInt(d)}/${parseInt(m)}/${y}`;
  
  const r = data[key] || {
    nhapMoi: 0, tonDau: 0, banhKhong: 0, banh15: 0, banh20: 0, nuoc: 0,
    tienLeDau: 0, tienCat: 0, chiPhi: [], ghiChu: '',
    tongBanhBan: 0, tienBan: 0, tongChiPhi: 0, tienTon: 0
  };
  
  currentDayData = JSON.parse(JSON.stringify(r));
  if (!currentDayData.chiPhi) currentDayData.chiPhi = [];
  
  const hasData = !isDayEmpty(currentDayData);
  
  if (hasData) {
    isEditMode = false;
    renderDayView();
  } else {
    isEditMode = true;
    renderDayForm();
  }
  
  document.getElementById('dayModal').classList.add('active');
}

function renderDayView() {
  const r = currentDayData;
  const banhE = (r.tonDau + r.nhapMoi) - r.tongBanhBan;
  
  let html = `
    <div class="section-title">📥 BÁNH MÌ</div>
    <div class="result-row"><span class="label">Tồn từ hôm qua</span><span class="value">${r.tonDau || 0} cái</span></div>
    <div class="result-row"><span class="label">Nhập mới</span><span class="value">${r.nhapMoi || 0} cái</span></div>
    <div class="result-row"><span class="label">Tổng có</span><span class="value">${(r.tonDau || 0) + (r.nhapMoi || 0)} cái</span></div>
    <div class="result-row"><span class="label">Bán ra</span><span class="value"><b>${r.tongBanhBan || 0} cái</b></span></div>
    <div class="result-row"><span class="label">Ế cuối ngày</span><span class="value">${banhE} cái</span></div>
    
    <div class="section-title">📤 CHI TIẾT BÁN</div>
    <div class="result-row"><span class="label">Bánh mì không (4k)</span><span class="value">${r.banhKhong || 0} cái</span></div>
    <div class="result-row"><span class="label">Bánh mì 15k</span><span class="value">${r.banh15 || 0} cái</span></div>
    <div class="result-row"><span class="label">Bánh mì 20k</span><span class="value">${r.banh20 || 0} cái</span></div>
    <div class="result-row"><span class="label">Nước (15k)</span><span class="value">${r.nuoc || 0} cốc</span></div>
    
    <div class="section-title">💵 CHI PHÍ LẤY HÀNG</div>
  `;
  
  (r.chiPhi || []).forEach(c => {
    if (c.ten || c.soTien) {
      html += `<div class="result-row"><span class="label">${c.ten || '(chưa đặt tên)'}</span><span class="value">${fmt(c.soTien)}</span></div>`;
    }
  });
  html += `<div class="result-row"><span class="label"><b>Tổng chi phí</b></span><span class="value"><b>${fmt(r.tongChiPhi)}</b></span></div>`;
  
  html += `
    <div class="section-title">💰 TIỀN</div>
    <div class="result-row"><span class="label">Tiền lẻ đầu ngày</span><span class="value">${fmt(r.tienLeDau)}</span></div>
    <div class="result-row"><span class="label">Tiền bán hàng</span><span class="value">${fmt(r.tienBan)}</span></div>
    <div class="result-row"><span class="label">Tiền cất đi (doanh thu)</span><span class="value"><b style="color:#2E7D32">${fmt(r.tienCat)}</b></span></div>
    <div class="result-row"><span class="label">Tiền tồn (để mai)</span><span class="value">${fmt(r.tienTon)}</span></div>
  `;
  
  if (r.ghiChu) {
    html += `<div class="section-title">📝 GHI CHÚ</div><div class="note-box" style="background:#FFF3CD; border-left:4px solid #FFC107; padding:8px 12px; margin:8px 0; font-size:13px; color:#5D4037; border-radius:4px;">${r.ghiChu}</div>`;
  }
  
  document.getElementById('dayContent').innerHTML = html;
  
  document.getElementById('editButtonArea').innerHTML = 
    `<button class="btn-edit" onclick="enableEditMode()">✏️ Sửa</button>`;
}

function renderDayForm() {
  const r = currentDayData;
  const dis = '';
  
  let html = `
    <div class="section-title">📥 BÁNH MÌ</div>
    <div class="row">
      <label>Tồn từ hôm qua</label>
      <input type="number" id="f_tonDau" value="${r.tonDau || 0}" min="0" inputmode="numeric" ${dis}>
      <span class="unit">cái</span>
    </div>
    <div class="row">
      <label>Nhập mới hôm nay</label>
      <input type="number" id="f_nhapMoi" value="${r.nhapMoi || 0}" min="0" inputmode="numeric" ${dis}>
      <span class="unit">cái</span>
    </div>
    
    <div class="section-title">📤 BÁN HÀNG</div>
    <div class="row">
      <label>Bánh mì không (4k)</label>
      <input type="number" id="f_banhKhong" value="${r.banhKhong || 0}" min="0" inputmode="numeric" ${dis}>
      <span class="unit">cái</span>
    </div>
    <div class="row">
      <label>Bánh mì 15k</label>
      <input type="number" id="f_banh15" value="${r.banh15 || 0}" min="0" inputmode="numeric" ${dis}>
      <span class="unit">cái</span>
    </div>
    <div class="row">
      <label>Bánh mì 20k</label>
      <input type="number" id="f_banh20" value="${r.banh20 || 0}" min="0" inputmode="numeric" ${dis}>
      <span class="unit">cái</span>
    </div>
    <div class="row">
      <label>Nước (15k)</label>
      <input type="number" id="f_nuoc" value="${r.nuoc || 0}" min="0" inputmode="numeric" ${dis}>
      <span class="unit">cốc</span>
    </div>
    
    <div class="section-title">💵 CHI PHÍ LẤY HÀNG</div>
    <div id="chiPhiList"></div>
    <button class="btn-add-item" onclick="addChiPhi()">+ Thêm mục</button>
    <div class="result-row">
      <span class="label">Tổng chi phí</span>
      <span class="value" id="tongChiPhi">0đ</span>
    </div>
    
    <div class="section-title">💰 TIỀN</div>
    <div class="row">
      <label>Tiền lẻ đầu ngày</label>
      <input type="number" id="f_tienLeDau" value="${r.tienLeDau || 0}" min="0" step="1000" inputmode="numeric" ${dis}>
      <span class="unit">đ</span>
    </div>
    <div class="row">
      <label>Tiền cất đi (doanh thu)</label>
      <input type="number" id="f_tienCat" value="${r.tienCat || 0}" min="0" step="1000" inputmode="numeric" ${dis}>
      <span class="unit">đ</span>
    </div>
    <div class="result-row">
      <span class="label">Tiền tồn (để mai)</span>
      <span class="value" id="tienTonHienthi">0đ</span>
    </div>
    
    <div class="section-title">📝 GHI CHÚ</div>
    <input type="text" id="f_ghiChu" class="note-input" value="${r.ghiChu || ''}" placeholder="Ghi chú thêm...">
  `;
  
  document.getElementById('dayContent').innerHTML = html;
  renderChiPhi();
  
  document.querySelectorAll('#dayContent input').forEach(input => {
    input.addEventListener('input', onFormInput);
    input.addEventListener('blur', onFormInput);
  });
  
  document.getElementById('editButtonArea').innerHTML = '';
  
  recalc();
}

function enableEditMode() {
  isEditMode = true;
  renderDayForm();
}

function renderChiPhi() {
  const list = document.getElementById('chiPhiList');
  list.innerHTML = '';
  (currentDayData.chiPhi || []).forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="text" class="name" value="${item.ten || ''}" placeholder="Tên mục">
      <input type="number" class="num" value="${item.soTien || 0}" step="1000" inputmode="numeric">
      <button class="remove" onclick="removeChiPhi(${idx})">✕</button>
    `;
    row.querySelector('.name').addEventListener('input', (e) => {
      currentDayData.chiPhi[idx].ten = e.target.value;
      onFormInput();
    });
    row.querySelector('.num').addEventListener('input', (e) => {
      currentDayData.chiPhi[idx].soTien = +e.target.value || 0;
      onFormInput();
    });
    list.appendChild(row);
  });
}

function addChiPhi() {
  if (!isEditMode) return;
  if (!currentDayData.chiPhi) currentDayData.chiPhi = [];
  currentDayData.chiPhi.push({ ten: '', soTien: 0 });
  renderChiPhi();
  onFormInput();
}

function removeChiPhi(idx) {
  if (!isEditMode) return;
  currentDayData.chiPhi.splice(idx, 1);
  renderChiPhi();
  onFormInput();
}

function onFormInput() {
  if (!currentDayData || !isEditMode) return;
  
  const el = (id) => document.getElementById(id);
  if (!el('f_tonDau')) return;
  
  currentDayData.tonDau = +el('f_tonDau').value || 0;
  currentDayData.nhapMoi = +el('f_nhapMoi').value || 0;
  currentDayData.banhKhong = +el('f_banhKhong').value || 0;
  currentDayData.banh15 = +el('f_banh15').value || 0;
  currentDayData.banh20 = +el('f_banh20').value || 0;
  currentDayData.nuoc = +el('f_nuoc').value || 0;
  currentDayData.tienLeDau = +el('f_tienLeDau').value || 0;
  currentDayData.tienCat = +el('f_tienCat').value || 0;
  currentDayData.ghiChu = el('f_ghiChu').value;
  
  currentDayData.tongBanhBan = currentDayData.banhKhong + currentDayData.banh15 + currentDayData.banh20;
  currentDayData.tienBan = currentDayData.banhKhong * 4000 + 
                            currentDayData.banh15 * 15000 + 
                            currentDayData.banh20 * 20000 + 
                            currentDayData.nuoc * 15000;
  currentDayData.tongChiPhi = (currentDayData.chiPhi || []).reduce((s, i) => s + (+i.soTien || 0), 0);
  currentDayData.tienTon = currentDayData.tienLeDau + currentDayData.tienBan - 
                            currentDayData.tongChiPhi - currentDayData.tienCat;
  
  el('tongChiPhi').textContent = fmt(currentDayData.tongChiPhi);
  el('tienTonHienthi').textContent = fmt(currentDayData.tienTon);
  
  if (isDayEmpty(currentDayData)) {
    delete data[currentEditingKey];
    renderCalendar();
    return;
  }
  
  data[currentEditingKey] = { ...currentDayData };
  renderCalendar();
  
  if (typeof onDataChanged === 'function') {
    onDataChanged(currentEditingKey, currentDayData);
  }
}

function recalc() {
  if (!currentDayData) return;
  const r = currentDayData;
  const tongChiPhiEl = document.getElementById('tongChiPhi');
  const tienTonEl = document.getElementById('tienTonHienthi');
  
  const tongChiPhi = (r.chiPhi || []).reduce((s, i) => s + (+i.soTien || 0), 0);
  const tienBan = (r.banhKhong || 0) * 4000 + (r.banh15 || 0) * 15000 + (r.banh20 || 0) * 20000 + (r.nuoc || 0) * 15000;
  const tienTon = (r.tienLeDau || 0) + tienBan - tongChiPhi - (r.tienCat || 0);
  
  if (tongChiPhiEl) tongChiPhiEl.textContent = fmt(tongChiPhi);
  if (tienTonEl) tienTonEl.textContent = fmt(tienTon);
}

async function closeDayModal() {
  if (typeof flushSheetsNow === 'function') {
    await flushSheetsNow();
  }
  document.getElementById('dayModal').classList.remove('active');
  currentEditingKey = null;
  currentDayData = null;
  isEditMode = false;
}

// ============ TỔNG KẾT THÁNG ============
function showMonthSummary() {
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  let tongDoanhThu = 0, tongBanh = 0, tongChiPhiHangNgay = 0;
  let ngayTot = 0, ngayThuong = 0, ngayE = 0, soNgay = 0;
  let bestDay = null, worstDay = null;
  
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(currentYear, currentMonth, d);
    const r = data[key];
    if (!r || isDayEmpty(r)) continue;
    soNgay++;
    tongDoanhThu += r.tienCat || 0;
    tongBanh += r.tongBanhBan || 0;
    tongChiPhiHangNgay += r.tongChiPhi || 0;
    
    if (r.tongBanhBan >= 28) ngayTot++;
    else if (r.tongBanhBan >= 20) ngayThuong++;
    else ngayE++;
    
    if (!bestDay || r.tongBanhBan > bestDay.sold) bestDay = { d, sold: r.tongBanhBan };
    if (!worstDay || r.tongBanhBan < worstDay.sold) worstDay = { d, sold: r.tongBanhBan };
  }
  
  // ⭐ Dùng null để tự động lấy từ Firebase
  const chiPhiLayHangTheoThang = tinhChiPhiLayHangTheoThang(null, data);
  const thangKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
  const chiPhiLayHang = chiPhiLayHangTheoThang[thangKey] || 0;
  
  const baoBiTheoThang = tinhBaoBiTheoThang(PACKAGING, data);
  const baoBi = baoBiTheoThang[thangKey] || 0;
  
  const doanhThuThuc = tongDoanhThu + tongChiPhiHangNgay;
  const tienDienNuoc = TIEN_DIEN_NUOC;
  const laiRong = doanhThuThuc - chiPhiLayHang - baoBi - tienDienNuoc;
  
  const tyLeLai = doanhThuThuc > 0 ? (laiRong / doanhThuThuc * 100) : 0;
  const laiRongColor = laiRong >= 0 ? '#2E7D32' : '#C62828';
  
  const chiPhiKhaiTruong = tinhChiPhiKhaiTruong(PURCHASES, PACKAGING);
  
  const html = `
    <div class="section-title">💰 DOANH THU</div>
    <div class="result-row">
      <span class="label">Tiền cất đi (trong tháng)</span>
      <span class="value">${fmt(tongDoanhThu)}</span>
    </div>
    <div class="result-row">
      <span class="label">Chi phí hàng ngày</span>
      <span class="value">${fmt(tongChiPhiHangNgay)}</span>
    </div>
    <div class="result-row" style="border-top: 2px solid #FFC107; padding-top: 12px; margin-top: 4px;">
      <span class="label"><b>Tổng doanh thu thực</b></span>
      <span class="value"><b>${fmt(doanhThuThuc)}</b></span>
    </div>
    
    <div class="section-title">💸 CHI PHÍ</div>

function cancelInvestEdit() {

      investList = fbData || JSON.parse(JSON.stringify(DEFAULT_INVESTMENTS));

    soLuong: soLuong.trim(),

function editInvestmentItem(idx) {

  if (soLuong === null) return;
  const tongTien = prompt('Tổng tiền (đ):', item.tongTien);
  if (tongTien === null) return;
  
  investList[idx] = {
    ...item,
    ten: ten.trim(),
    soLuong: soLuong.trim(),
    tongTien: parseInt(tongTien) || 0
  };
  renderInvestList();

      purchasesCache = fbData;
      purchasesLoaded = true;

  purchaseMonth = TODAY.getMonth();
  purchaseYear = TODAY.getFullYear();
  renderPurchaseCalendar();

  document.getElementById('purchaseModal').classList.remove('active');

function changePurchaseMonth(delta) {
  purchaseMonth += delta;
  if (purchaseMonth > 11) { purchaseMonth = 0; purchaseYear++; }
  if (purchaseMonth < 0) { purchaseMonth = 11; purchaseYear--; }
  renderPurchaseCalendar();
}

function renderPurchaseCalendar() {
  const cal = document.getElementById('purchaseCalendar');
  cal.innerHTML = '';
  
  const firstDay = new Date(purchaseYear, purchaseMonth, 1).getDay();
  const daysInMonth = new Date(purchaseYear, purchaseMonth + 1, 0).getDate();
  
  document.getElementById('purchaseYearBadge').textContent = `${purchaseMonth + 1}/${purchaseYear}`;
  
  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    cal.appendChild(empty);
  }
  
  for (let d = 1; d <= daysInMonth; d++) {
    const dayEl = document.createElement('div');
    dayEl.className = 'day';
    const dow = new Date(purchaseYear, purchaseMonth, d).getDay();
    if (dow === 0) dayEl.classList.add('sun');
    if (dow === 6) dayEl.classList.add('sat');
    
    const key = `${purchaseYear}-${String(purchaseMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    
    let hasPurchase = false;
    if (typeof purchasesCache !== 'undefined' && purchasesCache[key]) {
      hasPurchase = true;
    } else if (typeof PURCHASES !== 'undefined') {
      hasPurchase = PURCHASES.some(p => p.ngay === key);
    }
    
    if (hasPurchase) dayEl.classList.add('blue');
    
    dayEl.innerHTML = `<div class="num">${d}</div><div class="dot"></div>`;
    dayEl.onclick = () => openPurchaseDayModal(key);
    cal.appendChild(dayEl);
  }
}

async function openPurchaseDayModal(key) {
  currentPurchaseKey = key;
  purchaseEditMode = false;
  
  const [y, m, d] = key.split('-');
  document.getElementById('purchaseDayTitle').textContent = `📦 Nhập hàng ngày ${parseInt(d)}/${parseInt(m)}/${y}`;
  
  let dataPurchase = null;
  if (typeof purchasesCache !== 'undefined' && purchasesCache[key]) {
    dataPurchase = purchasesCache[key];
  } else if (typeof PURCHASES !== 'undefined') {
    const found = PURCHASES.find(p => p.ngay === key);
    if (found) dataPurchase = found;
  }
  
  if (dataPurchase) {
    currentPurchaseData = JSON.parse(JSON.stringify(dataPurchase));
    renderPurchaseDayView();
  } else {
    currentPurchaseData = {
      ngay: key,
      matHang: [{ ten: 'Bơ', soLuong: 0, donGia: 75000 }],
      ship: 0,
      ghiChu: ''
    };

    renderPurchaseDayForm();

}

function recalcPurchase() {
  const r = currentPurchaseData;
  if (!r) return;
  
  const shipEl = document.getElementById('p_ship');

  if (shipEl) r.ship = +shipEl.value || 0;

  let tong = r.ship;
  (r.matHang || []).forEach(m => {
    tong += (m.soLuong || 0) * (m.donGia || 0);
  });
  
  const tongEl = document.getElementById('p_tong');
  if (tongEl) tongEl.innerHTML = `<b>${tong.toLocaleString('vi-VN')}đ</b>`;

async function handleHoaDonUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  if (typeof processHoaDonImage !== 'function') {
    alert('❌ OCR chưa sẵn sàng');
    return;
  }
  
  const btnEl = event.target.parentElement.querySelector('button');
  const originalText = btnEl.textContent;
  btnEl.textContent = '⏳ Đang đọc hóa đơn...';
  btnEl.disabled = true;
  
  try {
    const parsed = await processHoaDonImage(file);
    
    if (parsed.matHang && parsed.matHang.length > 0) {
      const msg = `Đọc được ${parsed.matHang.length} mặt hàng:\n\n` +
        parsed.matHang.map(m => `• ${m.ten}: ${m.soLuong} × ${m.donGia.toLocaleString('vi-VN')}`).join('\n') +
        `\n\nThêm vào form?`;
      
      if (confirm(msg)) {
        currentPurchaseData.matHang = parsed.matHang.map(m => ({
          ten: m.ten,
          soLuong: m.soLuong,
          donGia: m.donGia
        }));
        renderPurchaseMatHang();
        recalcPurchase();
      }
    } else {
      alert('⚠️ Không đọc được mặt hàng nào. Vui lòng nhập tay.');
    }
  } catch (err) {
    alert('❌ Lỗi OCR: ' + err.message);
  } finally {
    btnEl.textContent = originalText;
    btnEl.disabled = false;
    event.target.value = '';
  }
}

// ============ RANDOM CÁC CON VẬT ============
const PETS = ['pet1.png', 'pet2.png', 'pet3.png', 'pet4.png', 'pet5.png', 'pet6.png'];

function renderPets() {
  const layer = document.getElementById('pets-layer');
  layer.innerHTML = '';
  
  const w = window.innerWidth;
  const h = window.innerHeight;
  
  let petCount, petSize, minDist, allowOverlap;
  if (w < 400) {
    petCount = 6; petSize = 40; minDist = 10; allowOverlap = true;
  } else if (w < 600) {
    petCount = 8; petSize = 90; minDist = 20; allowOverlap = false;
  } else if (w < 1024) {
    petCount = 10; petSize = 140; minDist = 30; allowOverlap = false;
  } else {
    petCount = 12; petSize = 200; minDist = 40; allowOverlap = false;
  }
  
  const calendarWidth = Math.min(420, w - 24);
  const calendarHeight = 500;
  const calendarLeft = (w - calendarWidth) / 2;
  const calendarRight = calendarLeft + calendarWidth;
  const calendarTop = (h - calendarHeight) / 2;
  const calendarBottom = calendarTop + calendarHeight;
  
  const centerX = w / 2;
  
  function isInForbiddenZone(x, y, size) {
    const buffer = allowOverlap ? 5 : 10;
    if (x + size > calendarLeft + buffer && 
        x < calendarRight - buffer && 
        y + size > calendarTop + buffer && 
        y < calendarBottom - buffer) {
      return true;
    }
    return false;
  }
  
  function isTooClose(x, y, size, placed, extraDist) {
    const ed = extraDist || 0;
    for (const p of placed) {
      const dx = (x + size/2) - (p.x + p.size/2);
      const dy = (y + size/2) - (p.y + p.size/2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < minDist + (size + p.size)/2 + ed) return true;
    }
    return false;
  }
  
  let list = [];
  if (petCount <= 6) {
    list = [...PETS];
  } else {
    for (let i = 0; i < 2; i++) {
      PETS.forEach(p => list.push(p));
    }
  }
  list = list.slice(0, petCount);
  
  const placed = [];
  const maxAttempts = 3000;
  
  for (const src of list) {
    const placedLeft = placed.some(p => p.src === src && p.side === 'left');
    const placedRight = placed.some(p => p.src === src && p.side === 'right');
    
    let forceSide = null;
    if (placedLeft && !placedRight) forceSide = 'right';
    else if (placedRight && !placedLeft) forceSide = 'left';
    
    let found = false;
    let currentAttempts = 0;
    
    while (!found && currentAttempts < maxAttempts) {
      currentAttempts++;
      const x = Math.random() * (w - petSize);
      const y = Math.random() * (h - petSize);
      
      const side = (x + petSize/2) < centerX ? 'left' : 'right';
      if (forceSide && side !== forceSide) continue;
      if (isInForbiddenZone(x, y, petSize)) continue;
      if (isTooClose(x, y, petSize, placed, 0)) continue;
      
      const sameImg = placed.filter(p => p.src === src);
      let tooCloseSameImg = false;
      for (const p of sameImg) {
        const dx = (x + petSize/2) - (p.x + p.size/2);
        const dy = (y + petSize/2) - (p.y + p.size/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < w * 0.4) { tooCloseSameImg = true; break; }
      }
      if (tooCloseSameImg) continue;
      
      placed.push({ x, y, size: petSize, src, side });
      found = true;
    }
    
    if (!found) {
      currentAttempts = 0;
      while (!found && currentAttempts < maxAttempts) {
        currentAttempts++;
        const x = Math.random() * (w - petSize);
        const y = Math.random() * (h - petSize);
        
        if (isInForbiddenZone(x, y, petSize)) continue;
        if (isTooClose(x, y, petSize, placed, 0)) continue;
        
        const side = (x + petSize/2) < centerX ? 'left' : 'right';
        placed.push({ x, y, size: petSize, src, side });
        found = true;
      }
    }
  }
  
  placed.forEach((p) => {
    const el = document.createElement('div');
    el.className = 'pet';
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.style.width = petSize + 'px';
    el.style.height = petSize + 'px';
    
    const duration = 2 + Math.random() * 1.5;
    const delay = Math.random() * 2;
    const reverse = Math.random() < 0.5;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = '-' + delay + 's';
    if (reverse) el.style.animationDirection = 'reverse';
    
    el.innerHTML = `<img src="${p.src}" alt="" onerror="this.parentElement.style.display='none'">`;
    layer.appendChild(el);
  });
  
  console.log(`🐾 Đã đặt ${placed.length}/${petCount} con vật (size ${petSize}px)`);
}

let lastWidth = window.innerWidth;
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (Math.abs(window.innerWidth - lastWidth) > 100) {
      lastWidth = window.innerWidth;
      renderPets();
    }
  }, 300);
});

renderCalendar();
renderPets();

(async () => {
  if (typeof initFirebase === 'function') {
    await initFirebase();
    
    if (typeof firebaseReady !== 'undefined' && firebaseReady) {
      const fbData = await loadFromFirebase();
      if (fbData && Object.keys(fbData).length > 0) {
        Object.assign(data, fbData);
        renderCalendar();
      }
      
      listenFirebase((realtimeData) => {
        Object.assign(data, realtimeData);
        renderCalendar();
      });
      
      // Load purchases từ Firebase
      if (typeof loadPurchasesFromFirebase === 'function') {
        const purchasesData = await loadPurchasesFromFirebase();
        if (purchasesData) {
          purchasesCache = purchasesData;
          purchasesLoaded = true;
        }
      }
    }
  }
  
  if (typeof loadLocal === 'function') {
    const localData = loadLocal();
    Object.assign(data, localData);
    renderCalendar();
  }
})();
</script>
